server.port=8080
app.environment=test
app.debug=true

# ==================== 日志配置 ====================
logging.file.path=logs
logging.level.root=INFO
logging.level.com.ai.agent=DEBUG
logging.level.okhttp3=INFO
logging.level.org.apache.dubbo=INFO

# ==================== Nacos ====================
spring.cloud.nacos.config.server-addr=127.0.0.1:8848
# spring.cloud.nacos.config.namespace=ai-agent-test
spring.cloud.nacos.discovery.server-addr=127.0.0.1:8848
# spring.cloud.nacos.discovery.namespace=ai-agent-test

# ==================== Dubbo 注册中心 ====================
dubbo.registry.address=nacos://127.0.0.1:8848

# ==================== Vault ====================
# Local MySQL uses the fixed root account below; do not request dynamic credentials from Vault.
spring.cloud.vault.enabled=false

# ==================== 数据库连接（Local MySQL）====================
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/ai_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


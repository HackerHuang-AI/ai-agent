# 服务端口
server.port=8080
# 环境标识，用于日志和监控区分
app.environment=test
# 开启调试模式（影响部分组件的详细输出）
app.debug=true

# ==================== 日志配置 ====================
logging.file.path=logs
logging.level.root=INFO
logging.level.com.ai.agent=DEBUG
logging.level.okhttp3=INFO
logging.level.org.apache.dubbo=INFO

# ==================== Nacos（test 环境，通过 namespace 隔离）====================
# Nacos 配置中心地址
spring.cloud.nacos.config.server-addr=127.0.0.1:8848
# test 命名空间 ID，填写 Nacos 控制台对应 namespace ID
spring.cloud.nacos.config.namespace=
spring.cloud.nacos.config.import-check.enabled=false
# Nacos 服务发现地址
spring.cloud.nacos.discovery.server-addr=127.0.0.1:8848
spring.cloud.nacos.discovery.namespace=${spring.cloud.nacos.config.namespace}

# ==================== Dubbo 注册中心 ====================
dubbo.registry.address=nacos://${spring.cloud.nacos.discovery.server-addr}
dubbo.registry.username=${spring.cloud.nacos.discovery.username:}
dubbo.registry.password=${spring.cloud.nacos.discovery.password:}
dubbo.config-center.address=nacos://${spring.cloud.nacos.config.server-addr}
dubbo.config-center.username=${spring.cloud.nacos.config.username:}
dubbo.config-center.password=${spring.cloud.nacos.config.password:}
dubbo.metadata-report.address=nacos://${spring.cloud.nacos.config.server-addr}
dubbo.metadata-report.username=${spring.cloud.nacos.config.username:}
dubbo.metadata-report.password=${spring.cloud.nacos.config.password:}

# ==================== Vault（本地 AppRole + 静态密钥）====================
# 先启动 ai-fabric 的 Local secrets；凭据由 data/init/ai-agent-test-vault.env 生成。
spring.config.import=optional:vault://
spring.cloud.vault.enabled=true
# Vault 服务地址
spring.cloud.vault.host=127.0.0.1
spring.cloud.vault.port=8200
spring.cloud.vault.scheme=http
# 使用 AppRole 认证方式
spring.cloud.vault.authentication=APPROLE
# Local 默认凭据仅用于本地开发；实际投产必须由运行环境注入 VAULT_ROLE_ID 和 VAULT_SECRET_ID，禁止保留明文。
spring.cloud.vault.app-role.role-id=${VAULT_ROLE_ID:507d9249-f269-e5d3-363b-38bf2ec4de02}
spring.cloud.vault.app-role.secret-id=${VAULT_SECRET_ID:2500d464-0763-9904-99c7-3eb7c2d81cd7}
spring.cloud.vault.app-role.app-role-path=approle
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.default-context=
spring.cloud.vault.kv.application-name=${spring.application.name}/${spring.profiles.active}
spring.cloud.vault.kv.profiles=

# ==================== 数据库连接（经 HAProxy 统一入口）====================
# 最小空闲连接数
spring.datasource.hikari.minimum-idle=2
# 最大连接池大小
spring.datasource.hikari.maximum-pool-size=10
# 获取连接超时时间（ms）
spring.datasource.hikari.connection-timeout=30000
# 连接最大空闲时间（ms）
spring.datasource.hikari.idle-timeout=600000
# 通过 HAProxy（6033 端口）代理访问 MySQL
spring.datasource.url=jdbc:mysql://127.0.0.1:6033/ai_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

